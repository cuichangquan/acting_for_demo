name: Verify Final Demo Revision Against RubyGems

on:
  push:
    branches:
      - verification/rubygems-0.1.0

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: demo_ci
          POSTGRES_DB: acting_for_demo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d acting_for_demo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAILS_ENV: test
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: demo_ci

    steps:
      - name: Checkout exact demo revision
        uses: actions/checkout@v6
        with:
          ref: e87ef0418d7938443ca3ad9fca109538e8db045b

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
          bundler: "4.0.3"

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          bundle install
          bundle info acting_for
          bundle exec ruby -e 'require "acting_for"; abort "wrong version" unless ActingFor::VERSION == "0.1.0"; puts "ActingFor version: #{ActingFor::VERSION}"'
          if grep -q "github.com/cuichangquan/acting_for" Gemfile.lock; then
            echo "Gemfile.lock unexpectedly contains Git source"
            exit 1
          fi
          grep "acting_for (0.1.0) sha256=a7c3cfc97bf04445c04b8fc9cbe6be8a9aa433cfb8ba20b0da90f853b1336abd" Gemfile.lock

      - name: Prepare test database without demo seeds
        run: bundle exec rails db:schema:load

      - name: Run demo integration tests
        run: bundle exec rails test
