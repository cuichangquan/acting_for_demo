name: Generate MCP client lockfile

on:
  push:
    branches:
      - docs/mcp-reference-integration-design

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Demo
        uses: actions/checkout@v6

      - name: Resolve Gemfile.lock
        run: docker run --rm -v "$PWD:/app" -w /app ruby:3.4.10-slim sh -lc 'apt-get update -qq && apt-get install --no-install-recommends -y build-essential libpq-dev git >/dev/null && bundle lock'

      - name: Commit resolved lockfile
        run: |
          if git diff --quiet -- Gemfile.lock; then
            echo "Gemfile.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gemfile.lock
          git commit -m "build: lock MCP HTTP client dependencies"
          git push origin HEAD:docs/mcp-reference-integration-design
